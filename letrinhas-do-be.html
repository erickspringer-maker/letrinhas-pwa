    <label class="fld"><span>Números trabalhados</span><select id="p-n"><option value="1">De 1 a 5</option><option value="2">De 1 a 10</option><option value="3">De 0 a 10</option><option value="4">De 0 a 20</option><option value="5">De 0 a 30</option></select></label>
    <label class="chk"><input type="checkbox" id="p-tens" ${S.set.tens?'checked':''}> Contar de 10 em 10 até 100</label>
    <h3>Leitura</h3>
    <label class="chk"><input type="checkbox" id="p-hard" ${S.set.hard?'checked':''}> Incluir famílias difíceis (CH, LH, NH, RR, SS, QU, GU, Ç, ÃO, BR/TR, AR/ES)</label>
    <label class="fld"><span>Família da semana (aparece mais vezes)</span><select id="p-fam">${FAM_OPTS.map(([v,t])=>`<option value="${v}" ${S.set.fam===v?'selected':''}>${t}</option>`).join('')}</select></label>
    <p class="note">A leitura guiada (sílaba por sílaba) funciona em português e espanhol. Sem a opção acima marcada, só aparecem sílabas simples, como BO-LA e CA-VA-LO.</p>
    <label class="chk"><input type="checkbox" id="p-auto" ${S.set.auto?'checked':''}> Avançar de nível sozinho quando ele dominar o atual</label>
    <label class="fld"><span>Volume dos efeitos</span><input type="range" id="p-vol" min="0" max="1" step="0.1" value="${S.set.vol}"></label>
    <h3>Progresso</h3>
    <p class="note">Verde: já acerta bem. Amarelo: aprendendo. Ponto vermelho: errou há pouco e vai aparecer mais vezes.</p>
    <div class="prog">${ALL.map(c=>`<div class="pc ${mclass('L:'+c)}">${c}</div>`).join('')}</div>
    <div class="prog">${Array.from({length:31},(_,i)=>`<div class="pc ${mclass('N:'+i)}">${i}</div>`).join('')}</div>
    <p class="note">Estrelas: <b>${S.total}</b> · Figurinhas: <b>${earned()}</b> de ${FIG.length}</p>
    <div><button class="sbtn ghost" id="p-reset">Zerar progresso</button>
      <div class="confirm" hidden>Apagar estrelas e progresso? <button class="sbtn red" id="p-yes">Sim, zerar</button><button class="sbtn" id="p-no">Cancelar</button></div></div>
    <h3>Instalar no celular</h3>
    <p class="note">Abra o endereço do jogo no navegador do celular. No Android (Chrome): menu ⋮ › “Instalar app” ou “Adicionar à tela inicial”. No iPhone (Safari): botão Compartilhar › “Adicionar à Tela de Início”. Se a voz de um idioma não aparecer, instale-a nas configurações de “texto para fala” do aparelho.</p>
    <button class="sbtn big" id="p-close">Pronto</button></div>`;
  document.body.appendChild(wrap);
  const reopen=()=>{const st=$('.sheet',wrap).scrollTop;wrap.remove();openPais();const nsh=$('.pais-panel .sheet');if(nsh)nsh.scrollTop=st;};
  $('#p-l',wrap).value=String(S.levels.L);$('#p-n',wrap).value=String(S.levels.N);
  $('#p-lang',wrap).addEventListener('change',e=>{S.set.lang=e.target.value;if(S.set.lang2===S.set.lang)S.set.lang2='';save();reopen();});
  $('#p-lang2',wrap).addEventListener('change',e=>{S.set.lang2=e.target.value;save();reopen();});
  $$('select[data-lang]',wrap).forEach(s=>s.addEventListener('change',e=>{S.set.voices[e.target.dataset.lang]=e.target.value;save();}));
  $$('.chars button',wrap).forEach(b=>b.onclick=()=>{S.set.char=b.dataset.ch;save();$$('.chars button',wrap).forEach(x=>x.classList.toggle('on',x===b));if(b.dataset.ch!=='rand'){CUR=CHARS.find(c=>c.id===b.dataset.ch);speak(T().hello(S.set.nick));}});
  $('#p-name',wrap).addEventListener('change',e=>{S.set.name=cleanName(e.target.value)||'BERNARDO';e.target.value=S.set.name;save();});
  $('#p-nick',wrap).addEventListener('change',e=>{S.set.nick=e.target.value.trim()||'Bê';save();});
  $('#p-friends',wrap).addEventListener('change',e=>{S.set.friends=e.target.value;save();});
  const avNote=t=>{const n=$('#p-avn',wrap);if(n)n.textContent=t;};
  const stillOf=src=>new Promise(res=>{const im=new Image();im.onload=()=>{try{const k=Math.min(1,180/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.85));}catch(e){res('');}};im.onerror=()=>res('');im.src=src;});
  const shrink=(src,max)=>new Promise(res=>{const im=new Image();im.onload=()=>{try{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.82));}catch(e){res('');}};im.onerror=()=>res('');im.src=src;});
  const readAv=(inp,key)=>inp&&inp.addEventListener('change',()=>{const f=inp.files&&inp.files[0];if(!f)return;avNote('Carregando…');
    const fr=new FileReader();fr.onload=async()=>{let url=fr.result;const gif=/gif/i.test(f.type);
      if(!gif||f.size>1.5e6){url=await shrink(url,360);if(gif)avNote('GIF grande demais: guardei só a primeira imagem. Para animar, use um GIF menor.');}
      if(!url){avNote('Não consegui abrir essa imagem.');return;}
      const old=Object.assign({},AV);AV[key]=url;delete AV.off;AV.s=await stillOf(AV.c||AV.g);
      if(!saveAV()){AV=old;avNote('Imagem grande demais para guardar. Tente um GIF menor.');return;}
      SFX.ding();reopen();};fr.readAsDataURL(f);});
  readAv($('#p-avc',wrap),'c');readAv($('#p-avg',wrap),'g');
  if($('#p-avx',wrap))$('#p-avx',wrap).onclick=()=>{AV={off:1};saveAV();reopen();};
  $('#p-l',wrap).addEventListener('change',e=>{S.levels.L=+e.target.value;save();});
  $('#p-n',wrap).addEventListener('change',e=>{S.levels.N=+e.target.value;save();});
  $('#p-tens',wrap).addEventListener('change',e=>{S.set.tens=e.target.checked;save();});
  $('#p-hard',wrap).addEventListener('change',e=>{S.set.hard=e.target.checked;save();});
  $('#p-fam',wrap).addEventListener('change',e=>{S.set.fam=e.target.value;save();});
  $('#p-auto',wrap).addEventListener('change',e=>{S.set.auto=e.target.checked;save();});
  $('#p-rate',wrap).addEventListener('change',e=>{S.set.rate=+e.target.value;save();});
  $('#p-vol',wrap).addEventListener('change',e=>{S.set.vol=+e.target.value;save();SFX.ding();});
  $('#p-test',wrap).onclick=()=>{if(S.set.char!=='rand')CUR=CHARS.find(c=>c.id===S.set.char)||CHARS[0];const l=L2();speak(T().test(S.set.nick),l?[{t:LANGS[l].t.test(S.set.nick),l}]:[]);};
  $('#p-reset',wrap).onclick=()=>{$('.confirm',wrap).hidden=false;};
  $('#p-no',wrap).onclick=()=>{$('.confirm',wrap).hidden=true;};
  $('#p-yes',wrap).onclick=()=>{const set=S.set;S=defaults();S.set=set;save();wrap.remove();goMenu();};
  $('#p-close',wrap).onclick=()=>{wrap.remove();goMenu();};
}

document.addEventListener('gesturestart',e=>e.preventDefault());
window.__lt={start:(id,st)=>{CS=st||0;ALLGAMES.find(g=>g.id===id).f();},win:()=>{if(CURG){const g=ALLGAMES.find(x=>x.id===CURG.gid);celebrate(CURG.gid,CURG.tok,g?g.f:goMenu);}},go:p=>({map:goMap,pet:goPet,album:goAlbum,menu:goMenu})[p](),state:()=>S,pen:()=>penalty($('.game'),()=>{}),av:()=>AV,gol:()=>golBanner(),stat:()=>STAT};
splash();
try{if('serviceWorker' in navigator&&document.querySelector('link[rel="manifest"]')&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{});}}catch(e){}
})();
