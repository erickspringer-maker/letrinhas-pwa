<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#FFC83D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Letrinhas">
<title>Letrinhas do Bê</title>
</head>
<body>
<title>Letrinhas do Bê</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@500;600;700;800&display=swap">
<style>
/* Mural da sala de aula: parede amarelo-sol pontilhada, cartões de cartolina com contorno de tinta e sombra "de brinquedo", lousa verde com moldura de madeira para escrever com o dedo */
:root{
  --sun:#FFC83D; --ink:#1F2544; --paper:#FFF6DF; --board:#2E5A4C; --wood:#A8682F;
  --tomato:#EF5B4C; --cobalt:#2D6CDF; --leaf:#2FA866; --grape:#8E5BD9; --tang:#FF8A26; --sky:#38B6DD; --pink:#EE5FA0; --chalk:#FFE27A;
  --f-display:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --f-letter:"Andika","Century Gothic","Verdana",sans-serif;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{height:100%;box-sizing:border-box}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
body{
  height:100%;margin:0;color:var(--ink);font-family:var(--f-display);font-size:16px;
  background:var(--sun) radial-gradient(circle at 3px 3px, rgba(31,37,68,.11) 1.6px, transparent 2.2px) 0 0/22px 22px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;
  overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;
}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column}
#stage{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:4px solid var(--cobalt);outline-offset:3px}
.chunky{border:3px solid var(--ink);border-radius:20px;background:var(--paper);box-shadow:0 5px 0 var(--ink);transition:transform .08s ease,box-shadow .08s ease}
.chunky:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}

/* ---------- abertura ---------- */
.splash{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding-block:20px}
.owl-big{font-size:96px;line-height:1;animation:floaty 2.4s ease-in-out infinite}
.logo{margin:0;font-weight:800;font-size:clamp(40px,12vw,58px);line-height:.88;letter-spacing:-.5px;transform:rotate(-3deg);text-wrap:balance}
.logo span{display:inline-block;color:var(--paper);background:var(--tomato);padding:2px 14px 0;border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);transform:rotate(4deg) translateY(6px);font-size:.72em}
.play-btn{width:132px;height:132px;border-radius:50%;background:var(--leaf);color:#fff;font-size:58px;padding-left:12px;margin-top:14px}
.hint-p{margin:8px 0 0;font-size:14px;font-weight:600;opacity:.75;max-width:30ch}
.langchip{font-size:15px;font-weight:700;opacity:.8}

/* ---------- menu ---------- */
.menu{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-block:16px 96px}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.mhead .logo{font-size:clamp(32px,10vw,44px)}
.album-btn{display:flex;align-items:center;gap:6px;padding:8px 14px;font-size:22px;font-weight:800;flex:none;background:var(--paper)}
.album-btn b{font-variant-numeric:tabular-nums}
.sec{display:inline-block;margin:24px 0 12px;font-size:19px;font-weight:800;background:var(--ink);color:var(--chalk);padding:1px 12px;border-radius:10px;transform:rotate(-1.5deg)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tile{position:relative;min-height:128px;padding:12px 14px;background:var(--c);color:#fff;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;text-align:left}
.tile:nth-child(odd){transform:rotate(-1.2deg)}
.tile:nth-child(even){transform:rotate(1.1deg)}
.tile:active{transform:translateY(4px) rotate(0)}
.tile:last-child:nth-child(odd){grid-column:1/-1;min-height:104px;flex-direction:row;align-items:center}
.tile .ico{font-size:48px;line-height:1;filter:drop-shadow(0 3px 0 rgba(31,37,68,.35))}
.tile .tname{font-size:19px;font-weight:800;line-height:1.05;text-shadow:0 2px 0 rgba(31,37,68,.45);text-wrap:balance}
.tile:last-child:nth-child(odd) .tname{font-size:22px;margin-left:14px;flex:1}
.tile .tstars{position:absolute;top:8px;right:10px;font-size:14px;font-weight:800;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:20px;padding:0 8px;font-variant-numeric:tabular-nums}
.tile .tnew{position:absolute;top:-10px;left:12px;font-size:12px;font-weight:800;background:var(--chalk);color:var(--ink);border:2px solid var(--ink);border-radius:10px;padding:0 7px;transform:rotate(-4deg)}

.pais{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;border:2px solid rgba(31,37,68,.35);background:rgba(255,246,223,.7);font-size:24px;display:grid;place-items:center;padding:0;z-index:5;touch-action:none}
.pais svg{position:absolute;inset:-3px;width:60px;height:60px;transform:rotate(-90deg)}
.pais circle{fill:none;stroke:var(--tomato);stroke-width:5;stroke-dasharray:176;stroke-dashoffset:176;transition:stroke-dashoffset .2s}
.pais.holding circle{stroke-dashoffset:0;transition:stroke-dashoffset 3s linear}

/* ---------- moldura dos jogos ---------- */
.game{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;padding-block:10px 14px;position:relative}
.bar{display:flex;align-items:center;gap:10px;flex:none}
.ibtn{width:54px;height:54px;font-size:25px;padding:0;display:grid;place-items:center;flex:none;border-radius:16px}
.ibtn.ghost{visibility:hidden}
.dots{flex:1;display:flex;justify-content:center;gap:7px;flex-wrap:wrap}
.dot{width:16px;height:16px;border-radius:50%;border:3px solid var(--ink);background:var(--paper)}
.dot.on{background:var(--leaf);animation:pop .3s}
.guide{display:flex;align-items:center;gap:6px;min-height:50px;flex:none}
.owl{font-size:38px;line-height:1;transform-origin:50% 100%;flex:none}
.owl.talk{animation:bob .32s ease-in-out infinite alternate}
.bubble{margin:0;flex:1;min-width:0;background:var(--paper);border:3px solid var(--ink);border-radius:16px 16px 16px 4px;padding:5px 12px;font-size:17px;font-weight:600;line-height:1.2;min-height:40px;display:flex;align-items:center}
.bubble:empty::before{content:"…";opacity:.4}
.play{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;gap:14px}

/* escolhas */
.choices{display:flex;gap:12px;justify-content:center;flex:none}
.pf .choices,.cw .choices,.syl .choices,.hid .choices,.junta .choices{width:100%}
.choice{flex:1;max-width:116px;height:96px;font-family:var(--f-letter);font-size:56px;font-weight:700;padding:0;line-height:1}
.choice.ok{background:var(--leaf);color:#fff;animation:pop .35s}
.shake,.wig{animation:shake .42s}

/* ---------- toque e ouça ---------- */
.tabs{display:flex;gap:12px;flex:none}
.tab{flex:1;height:56px;font-size:28px;font-weight:800;font-family:var(--f-letter)}
.tab.on{background:var(--ink);color:var(--chalk)}
.keys{flex:1;min-height:0;overflow-y:auto;display:grid;gap:10px;padding:4px 2px 10px;align-content:start}
.keys.kl{grid-template-columns:repeat(5,1fr)}
.keys.kn{grid-template-columns:repeat(4,1fr)}
.key{aspect-ratio:1/1;max-width:100%;background:var(--c);color:#fff;font-family:var(--f-letter);font-weight:700;font-size:clamp(28px,9vw,44px);padding:0;line-height:1;text-shadow:0 2px 0 rgba(31,37,68,.35);border-radius:16px}
.show{position:absolute;inset:0;z-index:4;background:var(--paper);border:3px solid var(--ink);border-radius:24px;box-shadow:0 6px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;animation:appear .25s ease-out}
.sbig{font-family:var(--f-letter);font-weight:700;font-size:clamp(110px,40vw,190px);line-height:.9;color:var(--cobalt);animation:pop .4s}
.sbig small{font-size:.55em;color:var(--tomato);margin-left:.12em}
.semo{font-size:86px;line-height:1}
.sword{font-family:var(--f-letter);font-size:clamp(28px,9vw,40px);font-weight:700;letter-spacing:2px;text-align:center}
.sword b{color:var(--tomato)}
.srow{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:320px;font-size:42px}
.srow span{animation:pop .35s both;animation-delay:var(--d)}
.stap{font-size:14px;font-weight:600;opacity:.6}

/* ---------- escrever ---------- */
.pick3{flex:1;display:flex;flex-direction:column;gap:16px;justify-content:center}
.bigpick{flex:1;max-height:150px;background:var(--c);color:#fff;display:flex;align-items:center;justify-content:center;gap:16px}
.bigpick span{font-family:var(--f-letter);font-size:52px;font-weight:700;text-shadow:0 3px 0 rgba(31,37,68,.35)}
.bigpick small{font-size:22px;font-weight:800}
.board{flex:1;min-height:0;position:relative;background:var(--board) radial-gradient(ellipse at 30% 20%, rgba(255,255,255,.08), transparent 60%);border:10px solid var(--wood);border-radius:20px;box-shadow:0 0 0 3px var(--ink),0 7px 0 3px var(--ink)}
.board canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.model{position:absolute;top:6px;left:10px;display:flex;align-items:center;gap:6px;color:#fff;font-family:var(--f-letter);font-weight:700;font-size:30px;pointer-events:none;z-index:1}
.model .memo{font-size:28px}
.skip{position:absolute;right:8px;bottom:8px;width:44px;height:44px;font-size:20px;padding:0;border-radius:14px;opacity:.85;z-index:2}
.ghost-ch{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-letter);font-weight:700;color:rgba(255,255,255,.16);font-size:min(62vw,52vh);line-height:1;pointer-events:none}
.palette{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;flex:none}
.crayon{width:42px;height:42px;border-radius:50%;border:3px solid var(--ink);background:var(--c);padding:0}
.crayon.on{transform:scale(1.18);box-shadow:0 0 0 4px var(--paper),0 0 0 7px var(--ink)}
.pbtn{width:52px;height:52px;font-size:24px;padding:0;border-radius:16px}

/* ---------- balões e pescaria ---------- */
.sky,.lake{flex:1;min-height:0;position:relative;overflow:hidden;border:3px solid var(--ink);border-radius:22px;box-shadow:0 5px 0 var(--ink);touch-action:none}
.sky{background:linear-gradient(#7FD0F2,#D4F2FC 75%,#E9F9E1)}
.sky::after{content:"";position:absolute;left:-10%;right:-10%;bottom:-30px;height:60px;background:#7CCB6B;border-top:3px solid var(--ink);border-radius:50%}
.lake{background:linear-gradient(#7CD3F0 0 10%,#3BA6D9 10%,#2079B5)}
.lake::before{content:"";position:absolute;left:0;right:0;top:calc(10% - 6px);height:12px;background:repeating-radial-gradient(circle at 10px -4px,transparent 0 9px,rgba(255,255,255,.6) 9px 11px,transparent 11px 20px);background-size:20px 12px}
.lake::after{content:"🌿 🪨 🌿    🪸  🌿";position:absolute;left:8px;right:8px;bottom:2px;font-size:30px;letter-spacing:6px;white-space:nowrap;overflow:hidden;opacity:.9}
.bucket{position:absolute;top:4px;right:8px;z-index:3;font-size:32px;display:flex;align-items:center;gap:2px;background:rgba(255,246,223,.85);border:2px solid var(--ink);border-radius:14px;padding:0 8px}
.bucket b{font-size:18px;font-variant-numeric:tabular-nums}
.balloon{position:absolute;left:0;top:0;width:86px;height:104px;padding:0;border:3px solid var(--ink);border-radius:50% 50% 46% 46%/55% 55% 45% 45%;background:radial-gradient(circle at 30% 26%,rgba(255,255,255,.7) 0 8%,transparent 9%),var(--c);will-change:transform;z-index:1}
.balloon::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:44px;background:rgba(31,37,68,.6)}
.balloon::before{content:"";position:absolute;left:calc(50% - 7px);bottom:-9px;border:7px solid transparent;border-bottom-color:var(--ink);border-top:0}
.balloon .bt{display:block;font-family:var(--f-letter);font-weight:700;font-size:48px;line-height:1;color:#fff;text-shadow:0 2px 0 rgba(31,37,68,.4)}
.balloon.no .bt,.fish.no .fl{animation:shake .42s}
.fish{position:absolute;left:0;top:0;width:100px;height:80px;border:0;background:none;padding:0;will-change:transform;z-index:1}
.fish .fe{display:block;font-size:76px;line-height:1}
.fish.r .fe{transform:scaleX(-1)}
.fish .fl{position:absolute;left:calc(50% - 22px);top:calc(50% - 24px);width:44px;height:44px;border-radius:50%;background:var(--paper);border:3px solid var(--ink);display:grid;place-items:center;font-family:var(--f-letter);font-weight:700;font-size:28px;line-height:1;color:var(--ink)}
.spark{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--c);border:2px solid var(--ink);pointer-events:none;animation:fly .6s ease-out forwards;z-index:2}

/* ---------- contar ---------- */
.field{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);gap:4px;background:var(--paper);border:3px solid var(--ink);border-radius:22px;box-shadow:0 5px 0 var(--ink);padding:8px}
.obj{position:relative;border:0;background:none;padding:0;display:grid;place-items:center;font-size:clamp(40px,12vw,60px);line-height:1;animation:pop .35s both;animation-delay:var(--d)}
.obj .oe{display:inline-block;transition:transform .2s}
.obj.counted .oe{transform:scale(1.15) rotate(-6deg)}
.obj .badge{position:absolute;top:0;right:4px;min-width:30px;height:30px;border-radius:15px;background:var(--tomato);color:#fff;border:2px solid var(--ink);font-size:18px;font-weight:800;display:none;place-items:center;padding:0 6px;font-variant-numeric:tabular-nums}
.obj.counted .badge{display:grid;animation:pop .3s}

/* ---------- trem ---------- */
.rail{flex:none;padding:18px 0 4px;overflow:hidden}
.train{display:flex;align-items:flex-end;gap:5px;transition:transform 1.7s cubic-bezier(.5,0,.9,.4)}
.train.go{transform:translateX(-140%)}
.loco{font-size:60px;line-height:.9;flex:none}
.slot{flex:1;min-width:0;max-width:66px;aspect-ratio:1/1;border:3px dashed rgba(31,37,68,.45);border-radius:12px;display:grid;place-items:center;font-family:var(--f-letter);font-weight:700;font-size:clamp(24px,8vw,36px);position:relative;background:rgba(255,246,223,.45)}
.slot span{opacity:0}
.slot.hint span{opacity:.3}
.slot.next{animation:pulse 1s ease-in-out infinite;border-color:var(--ink)}
.slot.filled{border:3px solid var(--ink);background:var(--c);color:#fff;animation:pop .3s}
.slot.filled span{opacity:1;text-shadow:0 2px 0 rgba(31,37,68,.4)}
.slot.filled::before,.slot.filled::after,.wagon::before,.wagon::after{content:"";position:absolute;bottom:-10px;width:16px;height:16px;border-radius:50%;background:var(--ink);border:3px solid var(--paper)}
.slot.filled::before,.wagon::before{left:6px}
.slot.filled::after,.wagon::after{right:6px}
.track{height:10px;margin-top:12px;border-top:3px solid var(--ink);background:repeating-linear-gradient(90deg,var(--wood) 0 9px,transparent 9px 18px)}
.yard{flex:1;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:22px 16px;padding:10px 0}
.wagon{position:relative;width:76px;height:70px;background:var(--c);color:#fff;font-family:var(--f-letter);font-weight:700;font-size:42px;padding:0;line-height:1;touch-action:none;text-shadow:0 2px 0 rgba(31,37,68,.35);border-radius:14px}
.wagon.drag{z-index:10;transition:none;box-shadow:0 10px 0 rgba(31,37,68,.5)}

/* ---------- palavras: primeira letra / quantas / nome / ditado ---------- */
.pf,.cw,.nm{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;gap:12px;min-height:0}
.pic{font-size:clamp(110px,36vw,150px);line-height:1;animation:pop .4s}
.pword{font-family:var(--f-letter);font-weight:700;font-size:clamp(30px,10vw,44px);letter-spacing:3px;text-align:center}
.pword .q{display:inline-block;min-width:.8em;text-align:center;color:var(--tomato);border-bottom:4px solid var(--tomato)}
.pword b{color:var(--leaf)}
.word-emoji{font-size:clamp(84px,26vw,110px);line-height:1;animation:pop .4s}
.tiles-row{display:flex;justify-content:center;gap:6px;width:100%;padding-bottom:30px}
.ltile{flex:1 1 0;max-width:66px;min-width:0;aspect-ratio:3/4;font-family:var(--f-letter);font-weight:700;font-size:clamp(24px,8vw,42px);position:relative;padding:0;line-height:1;border-radius:14px}
.ltile.lit{background:var(--chalk)}
.ltile .n{position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);font-family:var(--f-display);font-size:20px;font-weight:800;color:var(--tomato);font-variant-numeric:tabular-nums}
.slots .ltile{border:3px dashed rgba(31,37,68,.45);background:rgba(255,246,223,.5);box-shadow:none;display:grid;place-items:center}
.slots .ltile.lit{border-style:solid;background:var(--chalk);box-shadow:0 4px 0 var(--ink);animation:pop .3s}
.slots .ltile.next{border-color:var(--ink);animation:pulse 1s infinite}
.pool{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;max-width:400px}
.pool .ltile{flex:none;width:58px;max-width:none;background:var(--c);color:#fff;text-shadow:0 2px 0 rgba(31,37,68,.35)}

/* ---------- memória ---------- */
.memgrid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-content:center}
.mcard{aspect-ratio:3/4;max-width:100%;border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);background:var(--cobalt) repeating-linear-gradient(45deg,rgba(255,255,255,.14) 0 8px,transparent 8px 16px);padding:0;font-family:var(--f-letter);font-weight:700;font-size:clamp(32px,11vw,52px);line-height:1;color:var(--ink)}
.mcard .mf{opacity:0}
.mcard.flip{background:var(--paper);animation:flipX .3s}
.mcard.flip .mf{opacity:1}
.mcard.match{background:var(--chalk);animation:pop .35s}

/* ---------- família silábica ---------- */
.syl{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;gap:10px;min-height:0}
.sylhead{display:flex;gap:10px;align-items:center;font-family:var(--f-letter);font-weight:700}
.sylc{font-size:76px;line-height:1;color:var(--tomato)}
.sylv{font-size:30px;letter-spacing:4px}
.sylplus{font-size:34px}
.sylcards{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%}
.sylcard{aspect-ratio:1/1.1;max-width:100%;background:var(--c);color:#fff;font-family:var(--f-letter);font-weight:700;font-size:clamp(22px,7vw,34px);padding:0;text-shadow:0 2px 0 rgba(31,37,68,.35)}
.sylcard.lit{box-shadow:0 5px 0 var(--ink),0 0 0 4px var(--chalk)}
.sylpic{min-height:120px;font-size:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.sylpic small{font-family:var(--f-letter);font-size:28px;font-weight:700;letter-spacing:2px;margin-top:6px}
.sylpic b{color:var(--tomato)}
.syl .choice{font-size:44px}

/* ---------- junta-junta ---------- */
.junta{flex:1;display:flex;flex-direction:column;gap:12px;min-height:0}
.groups{display:flex;align-items:stretch;gap:8px;flex:none}
.grp{flex:1;min-height:124px;background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:0 4px 0 var(--ink);display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:2px;padding:8px}
.plus{font-size:42px;font-weight:800;align-self:center}
.item{border:0;background:none;padding:2px;font-size:clamp(30px,9vw,42px);line-height:1}
.basket{flex:1;min-height:110px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.bin{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;max-width:280px;font-size:30px;min-height:36px;line-height:1}
.bin span{animation:drop .35s}
.bk{font-size:96px;line-height:.9}

/* ---------- quem tem mais ---------- */
.mais{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-top:14px}
.side{position:relative;background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink);display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:4px;padding:10px;font-size:clamp(28px,8.5vw,40px);line-height:1}
.side.ok{background:#BDEBC9;animation:pop .35s}
.side .cnt{position:absolute;top:-16px;left:50%;transform:translateX(-50%);min-width:40px;height:32px;border-radius:16px;background:var(--tomato);color:#fff;border:2px solid var(--ink);font-size:20px;font-weight:800;display:grid;place-items:center;padding:0 8px;font-family:var(--f-letter)}

/* ---------- número escondido ---------- */
.hid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;gap:12px;min-height:0}
.frog{font-size:72px;line-height:1;animation:floaty 2s ease-in-out infinite}
.seq{display:flex;gap:8px;justify-content:center;width:100%}
.ncard{flex:1 1 0;min-width:0;max-width:68px;aspect-ratio:3/4;display:grid;place-items:center;background:var(--paper);border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);font-family:var(--f-letter);font-weight:700;font-size:clamp(26px,9vw,44px)}
.ncard.q{background:var(--chalk);color:var(--tomato);animation:pulse 1s infinite}
.ncard.got{background:#BDEBC9;animation:pop .35s}

/* ---------- caça-letra ---------- */
.hunt{flex:1;min-height:0;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(5,1fr);gap:2px;background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink);padding:8px}
.hc{position:relative;border:0;background:none;padding:0;font-family:var(--f-letter);font-weight:700;line-height:1;color:var(--c);font-size:calc(clamp(24px,8vw,38px) * var(--sc));transform:rotate(var(--r))}
.hc.found::after{content:"";position:absolute;inset:0;margin:auto;width:1.25em;height:1.25em;border:4px solid var(--leaf);border-radius:50%;animation:pop .3s}

/* ---------- ligue os pontos ---------- */
.dotsboard{flex:1;min-height:0;background:var(--paper);border:3px solid var(--ink);border-radius:22px;box-shadow:0 5px 0 var(--ink);position:relative;overflow:hidden}
.dotsboard svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.dotsboard .lines{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.dotsboard .rubber{stroke:var(--tomato);stroke-width:1.6;stroke-dasharray:2 2;stroke-linecap:round}
.dotsboard .fillp{opacity:0;transition:opacity .8s;stroke:none}
.dotsboard .fillp.on{opacity:.85}
.dotsboard .pt circle{fill:var(--paper);stroke:var(--ink);stroke-width:1.2}
.dotsboard .pt text{font-family:var(--f-display);font-weight:800;font-size:6.4px;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.dotsboard .pt.done circle{fill:var(--ink)}
.dotsboard .pt.next circle{fill:var(--chalk);stroke:var(--tomato);stroke-width:1.6;animation:pulseR 1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.dotsboard .reveal{font-size:30px;text-anchor:middle;dominant-baseline:central;opacity:0;transition:opacity .6s .3s}
.dotsboard .reveal.on{opacity:1}

/* ---------- comemoração ---------- */
.celebrate{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;background:rgba(255,200,61,.94);border-radius:24px;animation:appear .3s}
.bigstar{font-size:130px;line-height:1;animation:starIn .9s cubic-bezier(.2,1.6,.4,1) both}
.celebrate h2{margin:0;font-size:clamp(28px,8.5vw,40px);font-weight:800;line-height:1.05;text-wrap:balance;padding:0 8px}
.newstk{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800;background:var(--paper);border:3px solid var(--ink);border-radius:18px;padding:6px 16px 6px 8px;box-shadow:0 4px 0 var(--ink)}
.newstk span{font-size:44px;animation:pop .5s .6s both}
.crow{display:flex;gap:14px;margin-top:6px}
.cbtn{min-width:130px;height:70px;font-size:22px;font-weight:800;padding:0 14px}
.cbtn.again{background:var(--leaf);color:#fff}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}

/* ---------- álbum ---------- */
.atitle{flex:1;margin:0;text-align:center;font-size:26px;font-weight:800}
.stickers{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-content:start;padding:6px 2px}
.stk{aspect-ratio:1/1;max-width:100%;border-radius:50%;display:grid;place-items:center;font-size:40px;border:3px dashed rgba(31,37,68,.35);color:rgba(31,37,68,.3);font-weight:800;background:rgba(255,246,223,.4);padding:0}
.stk.got{border:3px solid var(--ink);background:var(--paper);color:inherit;box-shadow:0 4px 0 var(--ink)}
.anote{text-align:center;margin:0;font-weight:700;opacity:.75}

/* ---------- área dos pais ---------- */
.pais-panel{position:fixed;inset:0;z-index:60;background:rgba(31,37,68,.55);display:flex;justify-content:center;align-items:flex-end;padding-top:env(safe-area-inset-top,0px)}
.sheet{width:100%;max-width:560px;max-height:100%;overflow-y:auto;background:#FFFDF7;color:var(--ink);border-radius:24px 24px 0 0;border:3px solid var(--ink);border-bottom:0;padding:20px max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));font-size:16px;-webkit-user-select:text;user-select:text;animation:up .25s ease-out}
.sheet h2{margin:0 0 12px;font-size:26px;line-height:1.1}
.sheet h3{margin:22px 0 6px;font-size:19px}
.fld{display:flex;flex-direction:column;gap:4px;margin:10px 0;font-weight:700}
.fld span{font-size:14px;letter-spacing:.3px;text-transform:uppercase;opacity:.7}
.fld input[type=text],.fld select{font:inherit;font-weight:600;padding:10px 12px;border:2px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink);max-width:100%}
.fld input[type=range]{width:100%;accent-color:var(--cobalt)}
.chk{display:flex;gap:10px;align-items:center;font-weight:600;margin:12px 0}
.chk input{width:22px;height:22px;accent-color:var(--leaf);flex:none}
.note{margin:4px 0 8px;font-size:14px;line-height:1.4;opacity:.8;max-width:65ch}
.sbtn{font:inherit;font-weight:800;padding:10px 16px;border:2px solid var(--ink);border-radius:12px;background:var(--paper);color:var(--ink)}
.sbtn.big{width:100%;margin-top:22px;height:56px;background:var(--leaf);color:#fff;font-size:20px}
.sbtn.red{background:var(--tomato);color:#fff}
.sbtn.ghost{background:transparent}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px;font-weight:700}
.prog{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:6px;margin-top:6px}
.pc{position:relative;aspect-ratio:1/1;border-radius:10px;border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--f-letter);font-weight:700;font-size:18px;background:#E9E6DD}
.pc.m1{background:var(--chalk)}
.pc.m2{background:#8BDDA9}
.pc.err::after{content:"";position:absolute;top:-4px;right:-4px;width:11px;height:11px;border-radius:50%;background:var(--tomato);border:2px solid var(--ink)}
.chars{display:flex;flex-wrap:wrap;gap:8px}
.chars button{font:inherit;font-weight:700;font-size:15px;padding:6px 10px;border:2px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink);display:flex;align-items:center;gap:6px}
.chars button span{font-size:24px}
.chars button.on{background:var(--chalk)}

/* ---------- animações ---------- */
@keyframes bob{from{transform:rotate(-6deg) translateY(0)}to{transform:rotate(6deg) translateY(-3px)}}
@keyframes floaty{50%{transform:translateY(-10px) rotate(4deg)}}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
@keyframes shake{0%,100%{translate:0}20%{translate:-9px}40%{translate:8px}60%{translate:-6px}80%{translate:4px}}
@keyframes pulse{50%{scale:1.08}}
@keyframes pulseR{50%{transform:scale(1.35)}}
@keyframes starIn{0%{transform:scale(0) rotate(-180deg)}100%{transform:scale(1) rotate(0)}}
@keyframes appear{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
@keyframes flipX{0%{scale:1 1}50%{scale:0 1}100%{scale:1 1}}
@keyframes drop{from{translate:0 -60px;opacity:0}to{translate:0 0;opacity:1}}
/* ---------- v3: barra, combo, efeitos ---------- */
.bar .mid{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.meds{display:flex;gap:4px;line-height:1}
.meds i{font-style:normal;font-size:17px;opacity:.28;filter:grayscale(1)}
.meds i.got{opacity:1;filter:none}
.meds i.cur{opacity:1;filter:none;animation:pulse 1.2s ease-in-out infinite}
.spk{flex:none;display:flex;align-items:center;gap:2px;font-weight:800;font-size:17px;background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:2px 8px;font-variant-numeric:tabular-nums}
.spk.bump{animation:pop .35s}
.combo{position:absolute;top:116px;right:2px;z-index:6;font-weight:800;font-size:22px;background:var(--tang);color:#fff;border:3px solid var(--ink);border-radius:16px;padding:0 10px;box-shadow:0 4px 0 var(--ink);opacity:0;pointer-events:none;rotate:6deg}
.combo.cshow{opacity:1;animation:pop .35s}
.combo.hot{background:var(--tomato);font-size:26px}
.fx{position:fixed;width:0;height:0;z-index:80;pointer-events:none}
.fx .ring{position:absolute;left:-30px;top:-30px;width:60px;height:60px;border-radius:50%;border:5px solid var(--chalk);animation:ring .55s ease-out forwards}
.fx .pd,.fx .pe{position:absolute;left:0;top:0;animation:burst .8s cubic-bezier(.15,.7,.4,1) both}
.fx .pd{width:11px;height:11px;margin:-6px;border-radius:3px;border:2px solid var(--ink)}
.fx .pe{font-size:24px;margin:-14px 0 0 -12px;line-height:1}
.plus{position:fixed;z-index:81;pointer-events:none;font-weight:800;font-size:24px;color:var(--ink);text-shadow:0 2px 0 #fff,0 -2px 0 #fff,2px 0 0 #fff,-2px 0 0 #fff;transform:translate(-50%,-50%);white-space:nowrap}
.flash{position:fixed;inset:0;z-index:79;pointer-events:none;background:radial-gradient(circle,rgba(255,255,255,.92),rgba(255,226,122,.5) 60%,transparent);animation:flashout .5s ease-out forwards}
.stageban{position:absolute;left:50%;top:42%;z-index:15;display:flex;align-items:center;gap:10px;font-size:40px;font-weight:800;background:var(--paper);border:4px solid var(--ink);border-radius:24px;padding:10px 26px;box-shadow:0 6px 0 var(--ink);pointer-events:none;animation:banner 1.9s ease forwards;white-space:nowrap}
.stageban span{font-size:54px;line-height:1}

/* ---------- comemoração v3 ---------- */
.celebrate{overflow-y:auto;justify-content:flex-start}
.cwrap{margin:auto;display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px 8px;max-width:100%}
.medal{font-size:120px;line-height:1;animation:starIn .9s cubic-bezier(.2,1.6,.4,1) both;filter:drop-shadow(0 6px 0 rgba(31,37,68,.35))}
.celebrate.gold .medal{font-size:136px}
.dancer{display:flex;align-items:flex-end;gap:14px;font-size:56px;line-height:1}
.dancer>span:first-child,.dancer .pet{animation:dance .55s ease-in-out infinite alternate}
.dancer .pet{animation-delay:.27s}
.bans{display:flex;flex-direction:column;gap:8px;align-items:center}
.bans:empty{display:none}
.ban{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:800;background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:4px 14px 4px 8px;box-shadow:0 4px 0 var(--ink);animation:slidein .5s both;text-align:left}
.ban span{font-size:32px;line-height:1}
.chest{position:relative;width:150px;height:126px;border:0;background:none;padding:0;margin-top:30px}
.chest .box{position:absolute;left:0;right:0;bottom:0;height:72px;background:linear-gradient(90deg,#8A4F1F 0 12%,#B0692C 12% 44%,#D9A13A 44% 56%,#B0692C 56% 88%,#8A4F1F 88%);border:4px solid var(--ink);border-radius:8px 8px 14px 14px;z-index:2}
.chest .lid{position:absolute;left:-4px;right:-4px;top:12px;height:46px;background:linear-gradient(90deg,#8A4F1F 0 12%,#C27A35 12% 44%,#E3B04B 44% 56%,#C27A35 56% 88%,#8A4F1F 88%);border:4px solid var(--ink);border-radius:40px 40px 6px 6px;transform-origin:6% 100%;transition:transform .5s cubic-bezier(.3,1.6,.5,1);z-index:3}
.chest .lock{position:absolute;left:50%;top:44px;width:26px;height:30px;margin-left:-13px;background:#FFD23F;border:3px solid var(--ink);border-radius:6px;z-index:4;transition:opacity .2s}
.chest .rays{position:absolute;left:50%;top:40%;width:260px;height:260px;margin:-130px 0 0 -130px;border-radius:50%;background:repeating-conic-gradient(rgba(255,255,255,.8) 0 10deg,transparent 10deg 30deg);opacity:0;transition:opacity .4s;animation:spin 6s linear infinite;-webkit-mask:radial-gradient(circle,#000 25%,transparent 70%);mask:radial-gradient(circle,#000 25%,transparent 70%);z-index:0;pointer-events:none}
.chest .prize{position:absolute;left:50%;top:34px;font-size:72px;line-height:1;transform:translate(-50%,0) scale(0);z-index:1;transition:transform .6s cubic-bezier(.2,1.8,.4,1) .15s}
.chest.knock{animation:shake .4s}
.chest.open .lid{transform:rotate(-115deg)}
.chest.open .lock{opacity:0}
.chest.open .rays{opacity:1}
.chest.open .prize{transform:translate(-50%,-78px) scale(1.15);z-index:5}
.chesthint{margin:0;font-weight:800;font-size:20px}

/* ---------- menu v3 ---------- */
.chips{display:flex;flex-direction:column;gap:6px;flex:none}
.chip{font-size:18px;font-weight:800;background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:1px 10px;box-shadow:0 3px 0 var(--ink);font-variant-numeric:tabular-nums;text-align:right}
.hub{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.hubb{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;background:var(--c);color:#fff;font-weight:800;font-size:16px;text-shadow:0 2px 0 rgba(31,37,68,.4)}
.hubb span{font-size:40px;line-height:1.1;text-shadow:none}
.tile .tstars{letter-spacing:-2px}

/* ---------- turma ---------- */
.fgrid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:12px;align-content:center}
.fcard{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 4px;min-height:84px;background:var(--paper);position:relative;min-width:0}
.fcard .fav{font-size:38px;line-height:1}
.fcard b{font-family:var(--f-letter);font-weight:700;font-size:clamp(19px,6.2vw,27px);letter-spacing:1px;line-height:1.1;max-width:100%;overflow-wrap:anywhere}
.fcard small{font-size:13px;font-weight:700;opacity:.7;line-height:1}
.fcard.ok,.fcard.found{background:#BDEBC9;animation:pop .35s}
.fcard.found::after{content:"✔";position:absolute;top:4px;right:8px;font-size:22px;color:var(--leaf)}
.lname{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.lname .fcard{min-height:72px}
.lname .fcard .fav{font-size:30px}
.bigl{align-self:center;font-family:var(--f-letter);font-weight:700;font-size:72px;line-height:1;color:var(--tomato);background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink);padding:4px 26px;animation:pop .4s}
.ng{flex:1;display:flex;flex-direction:column;justify-content:space-evenly;gap:12px}
.nrow{display:flex;align-items:center;gap:8px;border-radius:18px;padding:8px 6px 0;transition:background .2s}
.nrow .nav{flex:none;width:56px;height:56px;font-size:32px;display:grid;place-items:center;background:var(--c);border:3px solid var(--ink);border-radius:50%;margin-bottom:26px}
.nrow .tiles-row{justify-content:flex-start;padding-bottom:28px;min-width:0}
.nrow.pick{background:rgba(255,246,223,.65);outline:3px dashed var(--ink);cursor:pointer}
.nrow.ok{background:#BDEBC9;outline:3px solid var(--leaf)}

/* ---------- palavras ---------- */
.jsil{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;gap:12px;min-height:0}
.pic.dim{opacity:.35;animation:none}
.srow2{display:flex;gap:20px;justify-content:center;transition:gap .5s}
.srow2.joined{gap:0}
.scard{min-width:76px;height:92px;padding:0 10px;font-family:var(--f-letter);font-weight:700;font-size:42px;background:var(--c);color:#fff;text-shadow:0 2px 0 rgba(31,37,68,.35)}
.scard.next{animation:pulse 1s infinite}
.scard.done{box-shadow:0 5px 0 var(--ink),0 0 0 4px var(--chalk)}
.srow2.joined .scard{border-radius:0;background:var(--chalk);color:var(--ink);text-shadow:none;box-shadow:0 5px 0 var(--ink);animation:none}
.srow2.joined .scard:first-child{border-radius:20px 0 0 20px}
.srow2.joined .scard:last-child{border-radius:0 20px 20px 0}
.srow2.joined .scard+.scard{border-left-width:0}
.sdot{font-style:normal;opacity:.35;margin:0 3px}
.pf.syl2 .choice{font-size:40px}
.dice .choices{width:100%}
.readw{font-family:var(--f-letter);font-weight:700;font-size:clamp(44px,14vw,70px);letter-spacing:4px;background:var(--paper);border:3px solid var(--ink);border-radius:22px;box-shadow:0 5px 0 var(--ink);padding:10px 22px;text-align:center;max-width:100%;overflow-wrap:anywhere;animation:pop .4s}
.choice .ce{display:block;font-size:42px;line-height:1}
.choice small{display:block;font-family:var(--f-display);font-size:14px;font-weight:700;line-height:1.1;margin-top:3px}
.rtarget{display:flex;flex-direction:column;align-items:center;background:var(--paper);border:3px solid var(--ink);border-radius:24px;box-shadow:0 5px 0 var(--ink);padding:10px 30px;animation:pop .4s}
.rtarget span{font-size:96px;line-height:1}
.rtarget b{font-size:28px;letter-spacing:2px}

/* ---------- matemática ---------- */
.tira{flex:1;display:flex;flex-direction:column;gap:10px;min-height:0}
.tira .field{flex:1}
.monster{flex:none;display:flex;justify-content:center;align-items:center;height:92px}
.mon{font-size:80px;line-height:1;display:inline-block}
.mon.chomp{animation:chomp .35s}
.dice{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;gap:14px;min-height:0}
.drow{display:flex;gap:22px;position:relative}
.die{width:130px;height:130px;background:#fff;border:4px solid var(--ink);border-radius:24px;box-shadow:0 6px 0 var(--ink);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:14px;gap:4px;animation:roll .6s cubic-bezier(.2,1.4,.4,1)}
.drow.two .die{width:112px;height:112px;padding:12px}
.die i{border-radius:50%;place-self:center;width:74%;aspect-ratio:1/1}
.die i.on{background:var(--ink)}
.dcover{position:absolute;inset:-8px;display:grid;place-items:center;font-size:70px;font-weight:800;background:var(--cobalt) repeating-linear-gradient(45deg,rgba(255,255,255,.14) 0 8px,transparent 8px 16px);color:#fff;border:4px solid var(--ink);border-radius:24px;animation:pop .3s}
.peek{font-size:19px;font-weight:800;padding:8px 18px}
.shop{flex:1;display:flex;flex-direction:column;gap:12px;min-height:0}
.sitem{display:flex;align-items:center;justify-content:center;gap:14px;flex:none}

.se.bought{animation:jump .6s 2}
.tag{display:flex;flex-direction:column;align-items:center;background:var(--chalk);border:3px solid var(--ink);border-radius:14px 30px 30px 14px;box-shadow:0 4px 0 var(--ink);padding:4px 16px;font-weight:700;font-size:44px;line-height:1;font-family:var(--f-letter)}
.tag small{font-size:18px}
.thint{display:flex;gap:1px;font-size:14px;opacity:.55;margin-top:2px}
.counter{flex:none;min-height:84px;background:#E8D2B0;border:3px solid var(--ink);border-radius:18px;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:4px;padding:10px 36px 8px 8px;position:relative}
.counter::before{content:"balcão";position:absolute;top:-12px;left:12px;font-size:12px;font-weight:800;background:var(--paper);border:2px solid var(--ink);border-radius:8px;padding:0 6px}

.pack .pkt{font-size:19px;font-weight:800;line-height:1;text-align:center}
.pack small{font-size:12px;font-weight:700;opacity:.9}
.pack.knock .pk{animation:shake .4s}
.pack.open .pktop{transform:translateY(-60px) rotate(-25deg)}
.pack.open .pk{transform:scale(1.15) rotate(0);opacity:0}
.figs{display:flex;justify-content:center;align-items:flex-start;gap:10px;width:100%}
.figs:empty{display:none}
.fcd{position:relative;width:min(106px,28vw);height:150px;box-sizing:border-box;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:12px;box-shadow:0 5px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:8px 4px;transform:rotate(var(--r));animation:dealin .6s cubic-bezier(.2,1.5,.4,1) both}
.fcd:nth-child(2){animation-delay:.2s}.fcd:nth-child(3){animation-delay:.4s}
.fcd .ftag{font-size:11px;font-weight:800;background:var(--leaf);color:#fff;border-radius:6px;padding:0 6px;white-space:nowrap}
.fcd .ftag.dup{background:var(--tang)}
.fcd .ftag.acc{background:var(--grape)}
.fcd .ftag.sp{background:var(--tomato)}
.fcd .fe{font-size:50px;line-height:1}
.fcd .fn{font-size:13px;font-weight:800;line-height:1;text-align:center}
.fcd.shiny{height:166px;margin-top:-10px;background:linear-gradient(110deg,var(--paper) 30%,#fff 45%,var(--paper) 60%) 0 0/260px 100%;animation:dealin .6s cubic-bezier(.2,1.5,.4,1) both,shine 2.4s linear infinite;box-shadow:0 0 0 4px var(--chalk),0 6px 0 4px var(--ink)}
.fcd .fimg{width:80px;height:80px;border-radius:10px;border:2px solid var(--ink);object-fit:cover;background:#9ED3F5}
@keyframes dealin{from{opacity:0;transform:translateY(-80px) scale(.3) rotate(0)}to{opacity:1;transform:rotate(var(--r))}}
@keyframes shine{0%{background-position:-160px 0}100%{background-position:260px 0}}
.cbtn.pen-b{background:var(--tomato);color:#fff}
.celebrate.stadium .crow{flex-wrap:wrap;justify-content:center;gap:10px}
.celebrate.stadium .cbtn{min-width:120px;height:62px;font-size:20px}

/* pênalti */
.pen{position:absolute;inset:0;z-index:40;border-radius:24px;overflow:hidden;background:linear-gradient(#9ED3F5 0 13%,#2FA866 13% 100%);animation:appear .3s}

.pengoal{position:absolute;left:6%;right:6%;top:17%;height:26%;box-sizing:border-box;border:8px solid #fff;border-bottom:0;border-radius:6px 6px 0 0;box-shadow:0 0 0 3px var(--ink);background-color:rgba(255,255,255,.15);background-image:linear-gradient(rgba(31,37,68,.3) 1px,transparent 1px),linear-gradient(90deg,rgba(31,37,68,.3) 1px,transparent 1px);background-size:14px 14px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));z-index:1}

.pball{position:absolute;z-index:3;line-height:1;transform:translate(-50%,-50%);transition:left .4s cubic-bezier(.2,.8,.4,1),top .4s cubic-bezier(.2,.8,.4,1),font-size .4s;pointer-events:none}
.pspot{position:absolute;left:50%;top:80%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#fff}

.pkicks span.no{background:#fff}
.pres{position:absolute;left:14px;right:14px;bottom:18px;z-index:5;background:var(--paper);border:3px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px;animation:pop .45s cubic-bezier(.2,1.5,.4,1)}

.pres small{font-size:17px;font-weight:700}

/* álbum */
.abar{position:relative;height:30px;flex:none;background:var(--paper);border:3px solid var(--ink);border-radius:16px;overflow:hidden}

.acraque{display:flex;align-items:center;gap:12px;flex:none;text-align:left;background:linear-gradient(110deg,var(--paper) 30%,#fff 45%,var(--paper) 60%) 0 0/260px 100%;animation:shine 2.4s linear infinite;border:3px solid var(--ink);border-radius:16px;box-shadow:0 0 0 4px var(--chalk),0 5px 0 4px var(--ink);padding:6px 10px;font:inherit;color:inherit;margin:4px}

.apage.tp{background:rgba(255,246,223,.35)}

.aslot.got{background:var(--paper);border:3px solid var(--ink);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:6px 2px;font:inherit;animation:pop .4s both}

.afoot{display:flex;align-items:center;gap:10px;flex:none;background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:6px 12px}

/* mascote */
.petstage.field{position:relative;border-radius:24px;border:3px solid var(--ink);background:var(--leaf) repeating-linear-gradient(90deg,rgba(255,255,255,.08) 0 40px,transparent 40px 80px);box-shadow:0 5px 0 var(--ink);overflow:hidden}

.cme.e{display:grid;place-items:center;font-size:36px;background:var(--paper);border-color:var(--ink)}

function weightedChoice(items,ws){let t=Math.random()*ws.reduce((a,b)=>a+b,0);for(let j=0;j<items.length;j++){t-=ws[j];if(t<=0)return items[j];}return items[items.length-1];}
/* saco embaralhado com memória entre sessões: evita repetir o que saiu há pouco */
function bagPick(name,items,n=1,{weightFn=null,idFn=x=>(Array.isArray(x)?x[0]:String(x))}={}){
  if(!items.length)return[];
  const rec=S.recent[name]||(S.recent[name]=[]);
  const cap=Math.max(1,Math.floor(items.length*.6));
  const recSet=new Set(rec.slice(-cap));
  const owes=x=>typeof x==='string'&&S.items[x]&&S.items[x].w>0;
  let base=items.filter(x=>!recSet.has(idFn(x))||owes(x));
  if(base.length<Math.min(n,items.length))base=items.slice();
  const out=[];
  for(let i=0;i<n;i++){
    let cand=base.filter(x=>!out.includes(x));
    if(!cand.length){cand=items.filter(x=>x!==out[out.length-1]);if(!cand.length)cand=items;}
    const x=weightedChoice(cand,cand.map(c=>weightFn?weightFn(c):1));
    out.push(x);rec.push(idFn(x));
  }
  while(rec.length>Math.max(cap,n)+2)rec.shift();
  save();return out;
}

const synth=('speechSynthesis' in window)?window.speechSynthesis:null;

const norm=l=>(l||'').replace('_','-').toLowerCase();
const voicesFor=lang=>voices.filter(v=>norm(v.lang).startsWith(lang));
function voiceFor(lang){
  if(!voices.length)loadVoices();
  const want=S.set.voices[lang];
  if(want){const v=voices.find(v=>v.voiceURI===want);if(v)return v;}
  const vs=voicesFor(lang);if(!vs.length)return null;
  for(const p of LANGS[lang].pref){const m=vs.filter(v=>norm(v.lang)===p.toLowerCase());if(m.length)return m.find(v=>/google|natural|premium|enhanced|luciana|samantha/i.test(v.name))||m[0];}
  return vs[0];
}

function bubble(t){const b=$('.bubble');if(b)b.textContent=t;}
function owlTalk(on){const o=$('.owl');if(o)o.classList.toggle('talk',on);}
let spTok=0;
function hush(){spTok++;try{synth&&synth.cancel();}catch(e){}owlTalk(false);}
function utter(seg,my){
  return new Promise(res=>{
    if(my!==spTok)return res();
    const l=seg.l||S.set.lang;const u=new SpeechSynthesisUtterance(seg.t);
    const v=voiceFor(l);if(v){u.voice=v;u.lang=v.lang;}else u.lang=LANGS[l].pref[0];
    u.rate=Math.max(.5,Math.min(1.6,S.set.rate*CUR.r));u.pitch=CUR.p;u.volume=1;
    let done=false;const to=setTimeout(fin,1800+seg.t.length*95/u.rate);
    function fin(){if(done)return;done=true;clearTimeout(to);res();}
    u.onend=fin;u.onerror=fin;
    try{synth.speak(u);}catch(e){fin();}
  });
}
/* fala uma sequência; textos simples saem no idioma principal, {t,l} no idioma indicado */
function speak(...a){
  const segs=a.flat(3).filter(s=>s&&(typeof s==='string'?s.trim():s.t)).map(s=>typeof s==='string'?{t:s,l:S.set.lang}:s);
  bubble(segs.map(s=>s.t).join(' '));
  if(!synth||!segs.length)return sleep(Math.min(4000,700+segs.reduce((n,s)=>n+s.t.length,0)*55));
  const my=++spTok;try{synth.cancel();}catch(e){}
  owlTalk(true);
  let p=Promise.resolve();segs.forEach(s=>{p=p.then(()=>utter(s,my));});
  return p.then(()=>{if(my===spTok)owlTalk(false);});
}

let lastPt=[innerWidth/2,innerHeight/2];
document.addEventListener('pointerdown',e=>{lastPt=[e.clientX,e.clientY];},true);
function centerOf(el){if(el&&el.isConnected){const r=el.getBoundingClientRect();if(r.width)return[r.left+r.width/2,r.top+r.height/2];}return lastPt;}
function good(el){

function updCombo(){const c=$('.game .combo');if(!c)return;if(combo>=2){c.textContent=`🔥 x${combo}`;c.classList.remove('cshow');void c.offsetWidth;c.classList.add('cshow');c.classList.toggle('hot',combo>=5);}else c.classList.remove('cshow','hot');}
const FX_EMO=['⚽','⭐','💥','🌟','🎉','⚽'];
function burstAt(x,y,n){
  if(reduceMotion)return;
  const wrap=document.createElement('div');wrap.className='fx';wrap.style.left=x+'px';wrap.style.top=y+'px';
  const ring=document.createElement('i');ring.className='ring';wrap.appendChild(ring);
  const cnt=Math.min(24,10+n*2);
  for(let i=0;i<cnt;i++){const p=document.createElement('span');const a=Math.random()*Math.PI*2,d=50+Math.random()*(60+Math.min(n,10)*6);
    p.style.setProperty('--dx',(Math.cos(a)*d).toFixed(1)+'px');p.style.setProperty('--dy',(Math.sin(a)*d).toFixed(1)+'px');p.style.setProperty('--rot',(Math.random()*720-360).toFixed(0)+'deg');
    if(i%3===0){p.className='pe';p.textContent=FX_EMO[Math.min(FX_EMO.length-1,Math.floor(Math.random()*(2+n/2)))];}
    else{p.className='pd';p.style.background=rand(COLORS);}
    p.style.animationDelay=Math.floor(Math.random()*60)+'ms';wrap.appendChild(p);}
  document.body.appendChild(wrap);setTimeout(()=>wrap.remove(),1000);
}
function flyPlus(x,y,k){
  const t=$('.spk');const el=document.createElement('span');el.className='plus';el.textContent=`+${k}⚽`;el.style.left=x+'px';el.style.top=y+'px';document.body.appendChild(el);
  let fin=false;const done=()=>{if(fin)return;fin=true;el.remove();const tt=$('.spk');if(tt){$('b',tt).textContent=S.sparks;tt.classList.remove('bump');void tt.offsetWidth;tt.classList.add('bump');}};
  if(!t||reduceMotion||!el.animate){setTimeout(done,300);return;}
  const r=t.getBoundingClientRect();const dx=r.left+r.width/2-x,dy=r.top+r.height/2-y;
  const an=el.animate([{transform:'translate(-50%,-50%) scale(.6)',opacity:0},{transform:'translate(-50%,-130%) scale(1.3)',opacity:1,offset:.25},{transform:`translate(calc(-50% + ${dx.toFixed(0)}px),calc(-50% + ${dy.toFixed(0)}px)) scale(.5)`,opacity:.4}],{duration:900,easing:'ease-in'});
  an.onfinish=done;an.oncancel=done;setTimeout(done,1400);
}

/* ---------- confete e fogos ---------- */
function confetti(){
  if(reduceMotion)return;
  const c=document.createElement('canvas');c.className='confetti';document.body.appendChild(c);
  const ctx=c.getContext('2d');const dpr=Math.min(2,devicePixelRatio||1);
  const Wd=innerWidth,H=innerHeight;c.width=Wd*dpr;c.height=H*dpr;ctx.scale(dpr,dpr);
  const ps=Array.from({length:140},()=>({x:Wd/2+(Math.random()-.5)*60,y:H*.42,vx:(Math.random()-.5)*12,vy:-Math.random()*13-4,r:Math.random()*360,vr:(Math.random()-.5)*16,s:6+Math.random()*7,c:rand(COLORS)}));
  const t0=performance.now();
  (function f(now){const t=now-t0;ctx.clearRect(0,0,Wd,H);ps.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r*RAD);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66);ctx.restore();});if(t<2800)requestAnimationFrame(f);else c.remove();})(t0);
}
function fireworks(){
  if(reduceMotion)return;
  const c=document.createElement('canvas');c.className='confetti';document.body.appendChild(c);
  const ctx=c.getContext('2d');const dpr=Math.min(2,devicePixelRatio||1);const Wd=innerWidth,H=innerHeight;c.width=Wd*dpr;c.height=H*dpr;ctx.scale(dpr,dpr);
  const rockets=[],sp=[];const t0=performance.now();let launched=0;
  const launch=()=>rockets.push({x:Wd*(.15+Math.random()*.7),y:H,vx:(Math.random()-.5)*2,vy:-(H*.016+3+Math.random()*3),ty:H*(.12+Math.random()*.3),c:rand(COLORS)});
  (function f(now){const t=now-t0;ctx.clearRect(0,0,Wd,H);
    if(launched<8&&t>launched*360){launch();launched++;}
    for(let i=rockets.length-1;i>=0;i--){const r=rockets[i];r.x+=r.vx;r.y+=r.vy;r.vy+=.1;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(r.x,r.y,3,0,7);ctx.fill();
      if(r.y<=r.ty||r.vy>=0){rockets.splice(i,1);SFX.boom();for(let k=0;k<48;k++){const a=k/48*Math.PI*2,v=2+Math.random()*4;sp.push({x:r.x,y:r.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,c:Math.random()<.3?'#FFE27A':r.c});}}}
    for(let i=sp.length-1;i>=0;i--){const p=sp[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.06;p.vx*=.985;p.l-=.013;if(p.l<=0){sp.splice(i,1);continue;}ctx.globalAlpha=p.l;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,2.8,0,7);ctx.fill();}
    ctx.globalAlpha=1;
    if((t<3400||sp.length||rockets.length)&&t<8000)requestAnimationFrame(f);else c.remove();})(t0);
}

function crowdSound(dur=1.6){const a=ac();if(!a)return;try{
  const len=Math.floor(a.sampleRate*dur);const b=a.createBuffer(1,len,a.sampleRate);const ch=b.getChannelData(0);for(let i=0;i<len;i++)ch[i]=Math.random()*2-1;
  const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=900;f.Q.value=.6;
  const g=a.createGain();const t=a.currentTime;const v=Math.max(.0002,.35*S.set.vol);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.25);g.gain.setValueAtTime(v,t+dur*.55);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f).connect(g).connect(a.destination);s.start();
  [523,659,784].forEach((fr,i)=>tone(fr,.22,'square',.05,.1+i*.12));
}catch(e){}}

const figById=id=>FIG.find(f=>f.id===id);

function givePack(){
  const out=[];
  for(let i=0;i<3;i++){
    if(i===2&&AV.c&&!S.fig.includes('be10')){S.fig.push('be10');out.push({f:figById('be10'),isNew:true});continue;}
    if(i===2){const ac2=ACCESSORIES.filter(a=>!S.pet.acc.includes(a.id));if(ac2.length&&Math.random()<.45){const a=rand(ac2);S.pet.acc.push(a.id);out.push({acc:a,isNew:true});continue;}}
    const missing=FIG.filter(f=>!f.sp&&!S.fig.includes(f.id));
    if(missing.length&&Math.random()<.82){const f=rand(missing);S.fig.push(f.id);out.push({f,isNew:true});}

}

/* =========================================================
   ESCREVER COM O DEDO
   ========================================================= */
function resample(pts,step){
  const out=[pts[0].slice()];let acc=0;
  for(let i=1;i<pts.length;i++){let a=pts[i-1],b=pts[i];let seg=dist(a,b);
    while(seg>0&&acc+seg>=step){const t=(step-acc)/seg;const npnt=[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];out.push(npnt);a=npnt;seg=dist(a,b);acc=0;}
    acc+=seg;}
  const lp=pts[pts.length-1];if(dist(out[out.length-1],lp)>.6)out.push(lp.slice());return out;
}
function makeTracer(host,ch,tok,onFinish){
  host.innerHTML=`<div class="board"><div class="model"><span class="mch"></span><span class="memo"></span></div><canvas aria-label="Escreva ${esc(ch)} com o dedo"></canvas><button class="skip chunky" aria-label="Pular">⏭</button></div>`;
  const board=$('.board',host),cv=$('canvas',board),ctx=cv.getContext('2d');
  const strokes=glyphOf(ch).map(s=>resample(s,2.5));
  let si=0,ci=0,finished=false,Wd=0,H=0,dpr=1,Sz=1,ox=0,oy=0,raf=0,dead=false;
  let demoAt=performance.now()+700,lastProg=performance.now(),hinted=false,last=null,down=false,trail=[],nudgeAt=0;
  const TOL=12;
  function resize(){const r=cv.getBoundingClientRect();dpr=Math.min(2,devicePixelRatio||1);Wd=r.width;H=r.height;cv.width=Math.max(1,Wd*dpr);cv.height=Math.max(1,H*dpr);Sz=Math.max(40,Math.min(Wd*.86,H*.8));ox=(Wd-Sz)/2;oy=(H-Sz)/2+Math.min(14,H*.03);}
  const ro=new ResizeObserver(resize);ro.observe(board);resize();
  const X=u=>ox+u*Sz/100,Y=u=>oy+u*Sz/100;
  function toU(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left-ox)*100/Sz,(e.clientY-r.top-oy)*100/Sz];}
  function line(pts,upto,w,col,dash){if(upto<2)return;ctx.save();ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=w;ctx.strokeStyle=col;if(dash)ctx.setLineDash(dash);ctx.beginPath();ctx.moveTo(X(pts[0][0]),Y(pts[0][1]));for(let i=1;i<upto;i++)ctx.lineTo(X(pts[i][0]),Y(pts[i][1]));ctx.stroke();ctx.restore();}
  function circ(p,r,fill,stroke,label){ctx.save();ctx.beginPath();ctx.arc(X(p[0]),Y(p[1]),r,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.lineWidth=3;ctx.strokeStyle=stroke;ctx.stroke();}if(label){ctx.fillStyle='#fff';ctx.font=`800 ${Math.round(r*1.1)}px "Baloo 2", sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(label,X(p[0]),Y(p[1])+1);}ctx.restore();}
  function arrow(s,k,size){const a=s[Math.max(0,k-2)],b=s[k];const ang=Math.atan2(b[1]-a[1],b[0]-a[0]);ctx.save();ctx.translate(X(b[0]),Y(b[1]));ctx.rotate(ang);ctx.beginPath();ctx.moveTo(size,0);ctx.lineTo(-size*.7,-size*.75);ctx.lineTo(-size*.7,size*.75);ctx.closePath();ctx.fillStyle='rgba(255,255,255,.92)';ctx.fill();ctx.restore();}
  function frame(now){
    if(dead||!alive(tok))return;
    ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,Wd,H);
    const lw=Sz*.13;
    strokes.forEach(s=>line(s,s.length,lw,'rgba(255,255,255,.15)'));
    strokes.forEach(s=>line(s,s.length,3,'rgba(255,255,255,.6)',[2,9]));
    const col=finished?`hsl(${(now/5)%360} 92% 68%)`:'#FFE27A';
    const doneN=finished?strokes.length:si;
    for(let i=0;i<doneN;i++)line(strokes[i],strokes[i].length,lw*.78,col);
    if(!finished&&si<strokes.length){
      const s=strokes[si];
      if(ci>1)line(s,ci,lw*.78,col);
      const ak=Math.min(s.length-1,ci+7);if(ak>ci+2)arrow(s,ak,lw*.32);
      const p=s[Math.min(ci,s.length-1)];
      const pulse=1+.12*Math.sin(now/180);
      circ(p,lw*.44*(ci===0?pulse:1),'#2FA866','#fff',ci===0?String(si+1):'');
      if(ci===0){const t=(now-demoAt)/1500;if(t>=0&&t<=1){const q=s[Math.floor(t*(s.length-1))];circ(q,lw*.26,'rgba(255,255,255,.95)');}if(now-demoAt>5200)demoAt=now;}
      if(!hinted&&now-lastProg>9000){hinted=true;speak(T().traceHint);}
    }
    if(trail.length){ctx.save();ctx.lineCap='round';for(let i=1;i<trail.length;i++){const a=trail[i-1],b=trail[i];const age=(now-b.t)/400;if(age>1)continue;ctx.globalAlpha=(1-age)*.5;ctx.lineWidth=lw*.3;ctx.strokeStyle='#fff';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}ctx.restore();trail=trail.filter(p=>now-p.t<400);}
    raf=requestAnimationFrame(frame);
  }
  raf=requestAnimationFrame(frame);
  function track(p){
    if(finished)return;const cps=strokes[si];let best=-1;
    for(let k=ci;k<Math.min(cps.length,ci+5);k++){if(dist(p,cps[k])<TOL)best=k;}
    if(best>=0){ci=best+1;lastProg=performance.now();if(ci>=cps.length)strokeDone();}
  }
  function feed(p){if(last){const d=dist(last,p);const n=Math.max(1,Math.ceil(d/2));for(let i=1;i<=n;i++)track([last[0]+(p[0]-last[0])*i/n,last[1]+(p[1]-last[1])*i/n]);}else track(p);last=p;}
  function strokeDone(){
    si++;ci=0;last=null;
    if(si>=strokes.length){finished=true;SFX.win();setTimeout(()=>{if(!dead&&alive(tok))onFinish(false);},500);}
    else{SFX.ding();demoAt=performance.now()+400;hinted=false;}
  }
  cv.addEventListener('pointerdown',e=>{e.preventDefault();try{cv.setPointerCapture(e.pointerId);}catch(_){}down=true;demoAt=performance.now()+7000;const p=toU(e);
    if(!finished&&ci===0&&dist(p,strokes[si][0])>TOL*1.7&&performance.now()>nudgeAt){nudgeAt=performance.now()+4000;speak(T().green);}
    last=null;feed(p);});
  cv.addEventListener('pointermove',e=>{if(!down)return;const r=cv.getBoundingClientRect();trail.push({x:e.clientX-r.left,y:e.clientY-r.top,t:performance.now()});feed(toU(e));});
  const upH=()=>{down=false;last=null;};
  cv.addEventListener('pointerup',upH);cv.addEventListener('pointercancel',upH);
  $('.skip',board).onclick=()=>{SFX.tap();if(!finished){finished=true;onFinish(true);}};
  const destroy=()=>{dead=true;cancelAnimationFrame(raf);ro.disconnect();};
  cleanups.push(destroy);
  return{board,destroy};
}

/* =========================================================
   ESTOURA-BALÃO e PESCARIA (mesmo motor, cenários diferentes)
   ========================================================= */
function floatGame(gid,mode,again){
  const NT=[4,5,6][CS];const sh=shell(gid,NT),{tok,play}=sh;
  play.innerHTML=mode==='up'?'<div class="sky"></div>':'<div class="lake"><div class="bucket">🪣<b>0</b></div></div>';
  const area=play.firstElementChild;
  const pool=[...letterKeys(),...numberKeys()];
  const targets=bagPick(gid,pool,NT,{weightFn:weight});
  let t=0,target=targets[0],lock=false,raf=0,lastSpawn=0,prev=performance.now(),lastLane=-1;
  const items=[];
  const ask=()=>speak(mode==='up'?T().popIt(np(target)):T().fishIt(np(target)));repeatFn=ask;ask();
  function distractor(){
    const same=pool.filter(x=>x[0]===target[0]&&x!==target);
    const all=(target[0]==='L'?ALL.map(c=>'L:'+c):Array.from({length:maxNum()+1},(_,i)=>'N:'+i)).filter(x=>x!==target);
    return rand(CS===0?all:(same.length>=2?same:all));
  }
  function spawn(){
    const Wd=area.clientWidth,H=area.clientHeight;if(Wd<100)return;
    const hasT=items.some(b=>b.k===target);
    const k=(!hasT||Math.random()<.34)?target:distractor();
    const el=document.createElement('button');const b={el,k};
    if(mode==='up'){
      el.className='balloon';el.style.setProperty('--c',rand(COLORS));el.innerHTML=`<span class="bt">${kch(k)}</span>`;
      Object.assign(b,{x:Math.random()*(Wd-90),y:H+10,v:(H+150)/(7+Math.random()*3)*SPD[CS],sw:Math.random()*6.28});
    }else{
      const lanes=Math.max(3,Math.floor((H*.85)/88));let lane;do{lane=ri(0,lanes-1);}while(lane===lastLane&&lanes>1);lastLane=lane;
      const dir=Math.random()<.5?1:-1;el.className='fish'+(dir>0?' r':'');
      el.innerHTML=`<span class="fe">${rand(['🐟','🐠','🐡'])}</span><span class="fl">${kch(k)}</span>`;
      Object.assign(b,{dir,x:dir>0?-110:Wd+10,y:H*.13+lane*((H*.8)/lanes),v:(Wd+130)/(6.5+Math.random()*3.5)*SPD[CS],sw:Math.random()*6.28});
    }
    el.setAttribute('aria-label',kch(k));
    el.addEventListener('pointerdown',e=>{e.preventDefault();hit(b);});
    area.appendChild(el);items.push(b);
  }
  function burst(b){const r=b.el.getBoundingClientRect(),s=area.getBoundingClientRect();const cx=r.left-s.left+r.width/2,cy=r.top-s.top+r.height/2;const c=mode==='up'?b.el.style.getPropertyValue('--c'):'#E9F9FF';for(let i=0;i<10;i++){const p=document.createElement('i');p.className='spark';const a=i*36*RAD;p.style.cssText=`left:${cx-6}px;top:${cy-6}px;--c:${c};--dx:${Math.cos(a)*70}px;--dy:${Math.sin(a)*70}px`;area.appendChild(p);setTimeout(()=>p.remove(),650);}}
  function hit(b){
    if(lock||b.dead||!alive(tok))return;
    if(b.k===target){
      b.dead=true;burst(b);b.el.remove();items.splice(items.indexOf(b),1);mode==='up'?SFX.pop():SFX.splash();good();record(target,true);t++;sh.setDots(t,NT);lock=true;
      const bk=$('.bucket b',area);if(bk)bk.textContent=t;
      const done=t>=NT;
      speak(nameOf(b.k)+'!',echoK(b.k),pick(T().good)).then(()=>{if(!alive(tok))return;if(done){cancelAnimationFrame(raf);celebrate(gid,tok,again);}else{target=targets[t];lock=false;ask();}});
    }else{
      SFX.wrong();b.el.classList.remove('no');void b.el.offsetWidth;b.el.classList.add('no');record(target,false);
      speak(T().thisIs(np(b.k)),T().find(np(target)));
    }
  }
  function loop(now){
    if(!alive(tok))return;const dt=Math.min(.05,(now-prev)/1000);prev=now;
    if(now-lastSpawn>(mode==='up'?1150:1350)&&items.length<6){spawn();lastSpawn=now;}
    const Wd=area.clientWidth;
    for(let i=items.length-1;i>=0;i--){const b=items[i];b.sw+=dt*1.5;
      if(mode==='up'){b.y-=b.v*dt;b.el.style.transform=`translate(${b.x+Math.sin(b.sw)*10}px,${b.y}px)`;if(b.y<-150){b.el.remove();items.splice(i,1);}}
      else{b.x+=b.dir*b.v*dt;b.el.style.transform=`translate(${b.x}px,${b.y+Math.sin(b.sw*1.6)*6}px)`;if(b.x<-130||b.x>Wd+30){b.el.remove();items.splice(i,1);}}
    }
    raf=requestAnimationFrame(loop);
  }
  raf=requestAnimationFrame(loop);cleanups.push(()=>cancelAnimationFrame(raf));
}
const gBalao=()=>floatGame('balao','up',gBalao);
const gPesca=()=>floatGame('pesca','swim',gPesca);

async function gContar(){
  const NR=[5,5,6][CS];const sh=shell('contar',NR),{tok,play}=sh;
  const M=maxNum();const rng=(a,b)=>Array.from({length:Math.max(1,b-a+1)},(_,i)=>'N:'+(a+i));
  const cpool=CS===0?rng(1,M>=20?10:5):CS===1?(M>10?rng(6,Math.min(M,20)):rng(1,Math.max(5,M))):(M>10?rng(11,M):rng(3,Math.max(7,M)));
  const items=bagPick('contar'+CS,cpool,NR,{weightFn:weight});
  for(let i=0;i<items.length;i++){if(!alive(tok))return;await one(+kch(items[i]));if(!alive(tok))return;sh.setDots(i+1,NR);await wait(400);}
  celebrate('contar',tok,gContar);
  async function ask2(n,box){
    if(!alive(tok))return;const q=()=>speak(T().howMany);repeatFn=q;q();
    await askChoice(box,numOptions(n,1),n,{onWrong:o=>{record('N:'+n,false);speak(T().thisIs(np('N:'+o)),pick(T().again));}});
    record('N:'+n,true);await speak(`${pick(T().good)} ${NN(n)}!`,echoN(n));
  }
  function one(n){return new Promise(res=>{
    const emo=bagPick('obj',OBJS,1)[0];
    if(n<=10){
      play.innerHTML=`<div class="field"></div><div class="choices" hidden></div>`;
      const field=$('.field',play),box=$('.choices',play);
      shuffle([...Array(12).keys()]).slice(0,n).forEach((c,i)=>{const b=document.createElement('button');b.className='obj';b.style.gridRow=Math.floor(c/4)+1;b.style.gridColumn=c%4+1;b.style.setProperty('--d',(i*70)+'ms');b.innerHTML=`<span class="oe">${emo}</span><span class="badge"></span>`;field.appendChild(b);});
      let k=0;const ask=()=>speak(T().tapEach);repeatFn=ask;ask();
      $$('.obj',field).forEach(b=>b.onclick=()=>{
        if(b.classList.contains('counted')||k>=n){wiggle($('.oe',b));return;}
        k++;b.classList.add('counted');$('.badge',b).textContent=k;SFX.step(k);
        const p=speak(NN(k));if(k===n)p.then(()=>ask2(n,box)).then(res);
      });
      return;
    }
    const full=Math.floor(n/10),rest=n%10;
    play.innerHTML=`<div class="cframes">${Array.from({length:full},(_,f)=>`<button class="tf full" data-f="${f}" aria-label="Cartela de dez">${Array.from({length:10},()=>`<span>${emo}</span>`).join('')}<b class="tfb"></b></button>`).join('')}${rest?`<div class="tf part">${Array.from({length:10},(_,i)=>i<rest?`<button class="tobj"><span>${emo}</span></button>`:'<span class="e"></span>').join('')}</div>`:''}</div><div class="choices" hidden></div>`;
    const box=$('.choices',play);let k=0,fd=0;
    const ask=()=>speak(T().countFrames);repeatFn=ask;ask();
    const check=p=>{if(k===n)p.then(()=>ask2(n,box)).then(res);};
    $$('.tf.full',play).forEach(fr=>fr.onclick=()=>{if(fr.classList.contains('done')||k>=n)return;fr.classList.add('done');fd++;k+=10;$('.tfb',fr).textContent=k;SFX.step(fd*3);check(speak(NN(k)));});
    $$('.tobj',play).forEach(o=>o.onclick=()=>{if(o.classList.contains('counted')||k>=n)return;
      if(fd<full){wiggle(o);speak(T().tensFirst);return;}
      o.classList.add('counted');k++;SFX.step(k%10+4);check(speak(NN(k)));});
  });}
}

/* =========================================================
   TREM DOS NÚMEROS
   ========================================================= */
async function gTrem(){
  const sh=shell('trem',3),{tok,play}=sh;
  for(let r=0;r<3;r++){if(!alive(tok))return;await oneTrain();if(!alive(tok))return;sh.setDots(r+1,3);}
  celebrate('trem',tok,gTrem);
  function seqGen(){const M=maxNum();if(CS===2&&S.set.tens){const t=ri(1,6);return[0,1,2,3,4].map(i=>(t+i)*10);}const st=CS===0?(M>10?ri(1,6):1):ri(1,Math.max(1,M-4));const q=[0,1,2,3,4].map(i=>st+i);return CS===2?q.reverse():q;}
  function oneTrain(){return new Promise(res=>{
    const seq=seqGen();
    play.innerHTML=`<div class="rail"><div class="train"><div class="loco" aria-hidden="true">${CS===2&&!S.set.tens?'🚀':'🚂'}</div>${seq.map((n,i)=>`<div class="slot" data-i="${i}"><span>${n}</span></div>`).join('')}</div><div class="track"></div></div>
      <div class="yard">${shuffle(seq).map(n=>`<button class="wagon chunky${String(n).length>2?' w3':''}" data-n="${n}" style="--c:${rand(COLORS)}" aria-label="${n}">${n}</button>`).join('')}</div>`;
    let f=0,miss=0;const slots=$$('.slot',play);
    const mark=()=>slots.forEach((s,i)=>s.classList.toggle('next',i===f));mark();
    const ask=()=>speak(f===0?T()[CS===2&&!S.set.tens?'trainDown':'trainIntro'](NN(seq[0])):T().now(np('N:'+seq[f])));repeatFn=ask;ask();
    function place(w){
      const n=+w.dataset.n;
      if(n===seq[f]){const s=slots[f];s.classList.add('filled');s.classList.remove('hint');s.style.setProperty('--c',w.style.getPropertyValue('--c'));w.remove();good(s);record('N:'+n,true);f++;miss=0;mark();
        if(f===seq.length)finish();else speak(NN(n)+'!',T().now(np('N:'+seq[f])));return true;}
      SFX.wrong();record('N:'+seq[f],false);miss++;if(miss>=2)slots[f].classList.add('hint');
      speak(T().thisIs(np('N:'+n)),T().now(np('N:'+seq[f])));return false;
    }
    async function finish(){await speak(seq.map(n=>NN(n)).join(', ')+'!',CS===2&&!S.set.tens?T().liftoff:T().choo);if(!alive(tok))return;SFX.toot();$('.train',play).classList.add('go');await wait(1800);res();}
    $$('.wagon',play).forEach(w=>{
      let sx=0,sy=0,moved=false,id=null;
      w.addEventListener('pointerdown',e=>{e.preventDefault();id=e.pointerId;try{w.setPointerCapture(id);}catch(_){}sx=e.clientX;sy=e.clientY;moved=false;w.classList.add('drag');});
      w.addEventListener('pointermove',e=>{if(e.pointerId!==id)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.hypot(dx,dy)>8)moved=true;w.style.transform=`translate(${dx}px,${dy}px) scale(1.08)`;});
      w.addEventListener('pointerup',e=>{if(e.pointerId!==id)return;id=null;w.classList.remove('drag');const r=$('.rail',play).getBoundingClientRect();const over=e.clientY>=r.top-24&&e.clientY<=r.bottom+24;w.style.transform='';if(!moved||over){if(!place(w))wiggle(w);}});
      w.addEventListener('pointercancel',()=>{id=null;w.style.transform='';w.classList.remove('drag');});
    });
  });}
}

function densify(loop,target){const p=loop.map(q=>q.slice());while(p.length<target){let bi=0,bd=-1;for(let i=0;i<p.length;i++){const d=dist(p[i],p[(i+1)%p.length]);if(d>bd){bd=d;bi=i;}}const a=p[bi],b=p[(bi+1)%p.length];p.splice(bi+1,0,[+((a[0]+b[0])/2).toFixed(1),+((a[1]+b[1])/2).toFixed(1)]);}return p;}
async function gPontos(){
  const sh=shell('pontos',2),{tok,play}=sh;
  const pics=bagPick('shape',SHAPES,2,{idFn:s=>s.id});
  const mode=CS===2&&S.set.tens?'tens':CS>=1&&maxNum()>10?'twenty':'ten';
  for(let i=0;i<pics.length;i++){if(!alive(tok))return;await one(pics[i]);if(!alive(tok))return;sh.setDots(i+1,2);}
  celebrate('pontos',tok,gPontos);
  function one(sp){return new Promise(res=>{
    const pts=mode==='twenty'?densify([...sp.pts,...sp.close],20):sp.pts.slice();
    const step=mode==='tens'?10:1,start=mode==='tens'?10:1;const label=i=>start+i*step;
    const cx=pts.reduce((a,p)=>a+p[0],0)/pts.length,cy=pts.reduce((a,p)=>a+p[1],0)/pts.length;
    const lab=pts.map(([x,y])=>{const dx=x-cx,dy=y-cy,d=Math.hypot(dx,dy)||1;return[x+dx/d*7,y+dy/d*7];});
    const full=mode==='twenty'?[...pts,pts[0]]:[...pts,...sp.close,pts[0]];
    const r=mode==='twenty'?2.6:3.2,fs=mode==='twenty'?5.2:mode==='tens'?5:6.4,hitR=mode==='twenty'?5.5:8;
    play.innerHTML=`<div class="dotsboard"><svg viewBox="-8 -8 116 116" preserveAspectRatio="xMidYMid meet" aria-label="Ligue os pontos">
      <polygon class="fillp" fill="${sp.c}" points="${full.map(p=>p.join(',')).join(' ')}"></polygon>
      <polyline class="lines" points=""></polyline><line class="rubber" x1="0" y1="0" x2="0" y2="0" visibility="hidden"></line>
      ${pts.map((p,i)=>`<g class="pt ${i===0?'next':''}"><circle cx="${p[0]}" cy="${p[1]}" r="${r}"></circle><text x="${lab[i][0]}" y="${lab[i][1]}" style="font-size:${fs}px">${label(i)}</text></g>`).join('')}
      <text class="reveal" x="50" y="${cy}">${sp.e}</text></svg></div>`;
    const svg=$('svg',play),lines=$('.lines',svg),rub=$('.rubber',svg),gs=$$('.pt',svg);
    let f=0,down=false,lastHint=performance.now(),done=false;
    const toS=e=>{const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const m=svg.getScreenCTM();if(!m)return[0,0];const q=pt.matrixTransform(m.inverse());return[q.x,q.y];};
    const ask=()=>speak(f===0&&mode!=='tens'?T().dotsIntro:T().find(np('N:'+label(f))));repeatFn=ask;ask();
    function drawRubber(p){if(!p||f===0||done){rub.setAttribute('visibility','hidden');return;}const a=pts[f-1];rub.setAttribute('x1',a[0]);rub.setAttribute('y1',a[1]);rub.setAttribute('x2',p[0]);rub.setAttribute('y2',p[1]);rub.setAttribute('visibility','visible');}
    function connect(){
      gs[f].classList.remove('next');gs[f].classList.add('done');f++;lastHint=performance.now();
      lines.setAttribute('points',pts.slice(0,f).map(p=>p.join(',')).join(' '));SFX.step(f%14);
      if(f===pts.length){complete();return;}
      gs[f].classList.add('next');speak(NN(label(f-1)));
    }
    async function complete(){
      done=true;drawRubber(null);lines.setAttribute('points',full.map(p=>p.join(',')).join(' '));
      $('.fillp',svg).classList.add('on');$('.reveal',svg).classList.add('on');good(svg);SFX.win();
      const l2=L2();
      await speak(NN(label(pts.length-1))+'!',pick(T().good),T().dotsDone(sp.nm[S.set.lang]),l2?[{t:sp.nm[l2],l:l2}]:[]);await wait(900);res();
    }
    function tryHit(p,isDown){
      if(done)return;
      if(dist(p,pts[f])<hitR){connect();return;}
      if(isDown){const j=pts.findIndex((q,i)=>i>f&&dist(p,q)<hitR-2);if(j>=0){SFX.wrong();speak(T().thisIs(np('N:'+label(j))),T().find(np('N:'+label(f))));}}
    }
    svg.addEventListener('pointerdown',e=>{e.preventDefault();try{svg.setPointerCapture(e.pointerId);}catch(_){}down=true;const p=toS(e);tryHit(p,true);drawRubber(p);});
    svg.addEventListener('pointermove',e=>{if(!down)return;const p=toS(e);tryHit(p,false);drawRubber(p);});
    const upH=()=>{down=false;drawRubber(null);};svg.addEventListener('pointerup',upH);svg.addEventListener('pointercancel',upH);
    const iv=setInterval(()=>{if(!alive(tok)||done){clearInterval(iv);return;}if(performance.now()-lastHint>9000){lastHint=performance.now();speak(T().find(np('N:'+label(f))));}},1000);
    cleanups.push(()=>clearInterval(iv));
  });}
}

/* =========================================================
   LEITURA GUIADA: motor do leitor com o dedo
   ========================================================= */
function sayWord(w){return NAME_SAY[w]||w.toLowerCase();}
function ownSyl(){const n=cleanName(S.set.name)||'BERNARDO';return NAME_SYL[n]||n;}
function parseLine(str){
  return str.replace(/\{EU\}/g,ownSyl()).trim().split(/\s+/).map(tok=>{
    const m=tok.match(/^(.*?)([.,!?;:]*)$/);const core=m[1],punct=m[2];
    const syl=core.split('-');const disp=syl.slice();disp[disp.length-1]+=punct;
    return{syl,disp,say:sayWord(syl.join('').replace(/[¡¿]/g,''))};
  });
}
let readQ=Promise.resolve();
function enq(t){const my=spTok;bubble(t);owlTalk(true);readQ=readQ.then(()=>synth?utter({t,l:S.set.lang},my):sleep(450));readQ.then(()=>{if(my===spTok)owlTalk(false);});return readQ;}
function makeReader(host,text,{onDone,big=true,sylVoice=true,wordVoice=true}={}){
  const toks=parseLine(text);
  host.innerHTML=`<div class="reader ${big?'big':''}"><div class="rtext">${toks.map((w,wi)=>`<span class="rw" data-w="${wi}">${w.disp.map((s,si)=>`<span class="rs ${si%2?'alt':''}" data-w="${wi}" data-s="${si}">${esc(s)}</span>`).join('')}</span>`).join(' ')}</div><div class="rfinger" aria-hidden="true">👆</div></div>`;
  const R=$('.reader',host);const order=$$('.rs',R).map(el=>({el,w:+el.dataset.w,s:+el.dataset.s}));
  let idx=0,done=false,busy=false,down=false;
  const sentence=toks.map(t=>t.say).join(' ')+(/[!?]$/.test(text.trim())?text.trim().slice(-1):'.');
  function hit(x,y){let best=-1,bd=1e9;order.forEach((o,i)=>{const r=o.el.getBoundingClientRect();if(x<r.left-6||x>r.right+6)return;let d;if(y>=r.top&&y<=r.bottom)d=0;else if(y>r.bottom&&y<=r.bottom+110)d=y-r.bottom;else return;if(d<bd){bd=d;best=i;}});return best;}
  function step(i){
    if(done||busy)return;
    if(i!==idx){if(i>idx){const w=order[idx].el;w.classList.remove('want');void w.offsetWidth;w.classList.add('want');}return;}
    const o=order[i];o.el.classList.add('lit');idx++;
    const w=toks[o.w];const syl=w.syl[o.s].replace(/[¡¿]/g,'');
    if(sylVoice)enq(syl.toLowerCase());else SFX.step(idx);
    if(o.s===w.syl.length-1){$(`.rw[data-w="${o.w}"]`,R).classList.add('wdone');if(wordVoice&&w.syl.length>1)enq(w.say);}
    if(idx===order.length){done=true;const fin=()=>{if(!host.isConnected)return;if(wordVoice&&toks.length>1){speak(sentence).then(()=>onDone&&onDone());}else onDone&&onDone();};
      if(sylVoice||wordVoice)readQ.then(()=>setTimeout(fin,150));else setTimeout(fin,300);}
  }
  let last=null;
  const near=(o,x,y)=>{const r=o.el.getBoundingClientRect();return x>=r.left-8&&x<=r.right+8&&y>=r.top-10&&y<=r.bottom+75;};
  const probe=(x,y)=>{if(done||busy)return;const o=order[idx];if(o&&near(o,x,y)){step(idx);return;}const i=hit(x,y);if(i>idx)step(i);};
  const move=e=>{const x=e.clientX,y=e.clientY;if(last){const d=Math.hypot(x-last[0],y-last[1]);const n=Math.max(1,Math.ceil(d/6));for(let k=1;k<=n;k++)probe(last[0]+(x-last[0])*k/n,last[1]+(y-last[1])*k/n);}else probe(x,y);last=[x,y];};
  R.addEventListener('pointerdown',e=>{e.preventDefault();try{R.setPointerCapture(e.pointerId);}catch(_){}down=true;last=null;$('.rfinger',R).hidden=true;move(e);});
  R.addEventListener('pointermove',e=>{if(down)move(e);});
  const up=()=>{down=false;last=null;};R.addEventListener('pointerup',up);R.addEventListener('pointercancel',up);
  async function playK(){
    if(busy||done)return;busy=true;hush();
    for(const o of order){if(!host.isConnected)break;o.el.classList.add('kar');await speak(toks[o.w].syl[o.s].replace(/[¡¿]/g,'').toLowerCase());o.el.classList.remove('kar');
      const w=toks[o.w];if(o.s===w.syl.length-1&&w.syl.length>1&&host.isConnected)await speak(w.say);}
    if(toks.length>1&&host.isConnected)await speak(sentence);
    busy=false;
  }
  function reset(){idx=0;done=false;order.forEach(o=>o.el.classList.remove('lit','kar','want'));$$('.rw',R).forEach(w=>w.classList.remove('wdone'));}
  return{R,play:playK,reset,toks,sentence,isDone:()=>done};
}
