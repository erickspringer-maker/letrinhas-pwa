/* =========================================================
   LEITURA: Troca-Sílaba
   ========================================================= */
async function gTroca(){
  const N=[4,5,5][CS];const sh=shell('troca',N),{tok,play}=sh;
  const G=(TROCA[S.set.lang]||TROCA.pt);
  const pairs=[];G.forEach(g=>g.forEach(a=>g.forEach(b=>{if(a===b)return;const sa=a[0].split('-'),sb=b[0].split('-');if(sa.length!==sb.length)return;const d=sa.map((s,i)=>s!==sb[i]?i:-1).filter(i=>i>=0);if(d.length===1)pairs.push({a,b,d:d[0],g});})));
  const ps=bagPick('troca',pairs,N,{idFn:p=>p.a[0]+'>'+p.b[0]});
  for(let i=0;i<N;i++){if(!alive(tok))return;await one(ps[i]);if(!alive(tok))return;sh.setDots(i+1,N);await wait(500);}
  celebrate('troca',tok,gTroca);
  function one(p){return new Promise(async res=>{
    play.innerHTML=`<div class="rd"><div class="pic" aria-hidden="true">${p.a[1]}</div><div class="rhost"></div><div class="choices" hidden></div></div>`;
    const host=$('.rhost',play),pc=$('.pic',play),box=$('.choices',play);
    const ask1=()=>speak(T().readFinger);repeatFn=ask1;ask1();
    await new Promise(r=>makeReader(host,p.a[0],{onDone:r}));
    if(!alive(tok))return;good(pc);await wait(400);
    pc.textContent='❔';pc.classList.add('dim');SFX.flip();
    const r2=makeReader(host,p.b[0],{wordVoice:false,onDone:async()=>{
      if(!alive(tok))return;const q=()=>speak(T().whichPic);repeatFn=q;q();
      const other=rand(G.filter(g=>g!==p.g).flat().filter(w=>w[1]!==p.a[1]&&w[1]!==p.b[1]));
      await askChoice(box,shuffle([p.b,p.a,other]),p.b,{html:o=>`<span class="ce">${o[1]}</span>`,onWrong:o=>speak(T().thisWord(sayWord(o[0].replace(/-/g,''))),T().readAgain)});
      pc.textContent=p.b[1];pc.classList.remove('dim');
      await speak(T().readOk(sayWord(p.b[0].replace(/-/g,''))));res();}});
    const ch=$$('.rs',r2.R)[p.d];if(ch)ch.classList.add('chg');
    const ask2=()=>speak(T().changed);repeatFn=ask2;ask2();
  });}
}

/* =========================================================
   LEITURA: Frases Curtinhas
   ========================================================= */
async function gFrases(){
  const N=[3,4,4][CS];const sh=shell('frases',N),{tok,play}=sh;
  const all=(PHR[S.set.lang]||PHR.pt).filter(p=>S.set.hard||!p.h);
  const wc=p=>p.t.split(/\s+/).length;
  let pool=all.filter(p=>CS===0?wc(p)<=3:CS===1?wc(p)>=4&&wc(p)<=5:wc(p)>=4);if(pool.length<N)pool=all;
  const ps=bagPick('fr:'+S.set.lang+CS,pool,N,{idFn:p=>p.t});
  for(let i=0;i<N;i++){if(!alive(tok))return;await one(ps[i]);if(!alive(tok))return;sh.setDots(i+1,N);await wait(500);}
  celebrate('frases',tok,gFrases);
  function one(p){return new Promise(async res=>{
    play.innerHTML=`<div class="rd"><div class="pic dim" aria-hidden="true">❔</div><div class="rhost"></div><button class="slow chunky">🐢 Ouvir</button><div class="choices" hidden></div></div>`;
    const pc=$('.pic',play),box=$('.choices',play);
    const rdr=makeReader($('.rhost',play),p.t,{big:false,wordVoice:CS<2,sylVoice:true,onDone:async()=>{
      if(!alive(tok))return;$('.slow',play).hidden=true;
      const q=()=>speak(p.q);repeatFn=q;q();
      await askChoice(box,shuffle([p.ok,...p.alt]),p.ok,{onWrong:()=>speak(T().readAgain,p.q)});
      pc.textContent=p.ok;pc.classList.remove('dim');
      await speak(pick(T().good),rdr.sentence);res();}});
    $('.slow',play).onclick=()=>{SFX.tap();rdr.play();};
    const ask=()=>speak(T().readFingerS);repeatFn=ask;ask();
  });}
}

/* =========================================================
   LEITURA: Livrinhos do Bê
   ========================================================= */
async function gLivro(){
  const books=(BOOKS[S.set.lang]||BOOKS.pt).filter(b=>S.set.hard||!b.h);
  const b=bagPick('book:'+S.set.lang,books,1,{idFn:x=>x.t})[0];
  const NP=b.p.length;const sh=shell('livro',NP+1),{tok,play}=sh;
  for(let i=0;i<NP;i++){
    if(!alive(tok))return;const [scene,txt]=b.p[i];
    play.innerHTML=`<div class="book"><h3 class="btitle">📖 ${esc(b.t)}</h3><div class="bpage"><div class="bscene" aria-hidden="true">${scene}</div><div class="rhost"></div></div><div class="bnav"><button class="slow chunky">🐢 Ouvir</button><span class="pg">${i+1} / ${NP}</span></div></div>`;
    await new Promise(async res=>{
      const rdr=makeReader($('.rhost',play),txt,{big:false,onDone:()=>{if(!alive(tok))return;good($('.bscene',play));res();}});
      $('.slow',play).onclick=()=>{SFX.tap();rdr.play();};
      const ask=()=>speak(T().readFingerS);repeatFn=ask;
      if(i===0)await speak(T().bookIntro(b.t));
      if(!alive(tok))return;
      if(CS===0){await speak(T().listenFirst);if(!alive(tok))return;await rdr.play();if(!alive(tok))return;rdr.reset();}
      ask();
    });
    if(!alive(tok))return;sh.setDots(i+1,NP+1);
    if(i<NP-1)await speak(T().nextPage);
  }
  if(!alive(tok))return;
  play.innerHTML=`<div class="pf"><h3 class="btitle">📖 ${esc(b.t)}</h3><div class="pic" aria-hidden="true">❓</div><div class="choices"></div></div>`;
  const q=()=>speak(b.q);repeatFn=q;q();
  await askChoice($('.choices',play),shuffle([b.ok,...b.alt]),b.ok,{onWrong:()=>speak(pick(T().again),b.q)});
  $('.pic',play).textContent=b.ok;sh.setDots(NP+1,NP+1);
  await speak(pick(T().good));
  celebrate('livro',tok,gLivro);
}
